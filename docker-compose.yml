services:
  postgres:
    image: postgres:16
    container_name: botinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: botinance
      POSTGRES_USER: botinance
      POSTGRES_PASSWORD: ${BOTINANCE_DB_PASSWORD:?set BOTINANCE_DB_PASSWORD first}
    ports:
      - "5432:5432"
    volumes:
      - ./runtime_postgres/data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botinance -d botinance"]
      interval: 10s
      timeout: 5s
      retries: 5
